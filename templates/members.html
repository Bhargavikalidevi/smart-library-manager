{% extends "base.html" %}
{% block content %}
<div class="page-heading"><h1>Members</h1><a class="button" href="{{ url_for('add_member') }}">+ Add member</a></div>
<div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th></tr></thead><tbody>
{% for member in members %}<tr><td>{{ member.name }}</td><td>{{ member.email }}</td></tr>
{% else %}<tr><td colspan="2" class="empty">No members registered yet.</td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
