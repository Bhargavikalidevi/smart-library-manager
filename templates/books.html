{% extends "base.html" %}
{% block content %}
<div class="page-heading"><h1>Books</h1><a class="button" href="{{ url_for('add_book') }}">+ Add book</a></div>
<form class="search" method="get"><input name="q" value="{{ q }}" placeholder="Search title, author, ISBN"><button>Search</button></form>
<div class="table-wrap"><table><thead><tr><th>Title</th><th>Author</th><th>ISBN</th><th>Available</th><th>Total</th><th>Action</th></tr></thead><tbody>
{% for book in books %}
<tr><td>{{ book.title }}</td><td>{{ book.author }}</td><td>{{ book.isbn }}</td><td>{{ book.available_copies }}</td><td>{{ book.total_copies }}</td><td><form method="post" action="{{ url_for('delete_book', book_id=book.id) }}" onsubmit="return confirm('Delete this book?')"><button class="link danger-text">Delete</button></form></td></tr>
{% else %}<tr><td colspan="6" class="empty">No books found.</td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
